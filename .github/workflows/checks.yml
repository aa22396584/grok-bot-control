name: Offline checks

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHONDONTWRITEBYTECODE: 1

permissions:
  contents: read

jobs:
  offline-matrix:
    name: Offline (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify generated metadata
        run: python scripts/sync_metadata.py --check
      - name: Scan for private data
        run: python scripts/check_private_data.py
      - name: Run release tests
        run: python -m unittest discover -s tests -v
      - name: Run skill tests
        run: python -m unittest discover -s plugins/grok-bot-control/skills/grok-bot-control/tests -v
      - name: Run synthetic review cases
        run: python scripts/run_review_cases.py
      - name: Validate source release
        run: python scripts/validate_release.py
      - name: Build and verify deterministic archives
        run: python scripts/build_release.py --output dist

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned analysis tools
        run: python -m pip install --disable-pip-version-check ruff==0.15.7 mypy==1.19.1
      - name: Lint Python
        run: ruff check scripts tests plugins/grok-bot-control/skills/grok-bot-control/scripts plugins/grok-bot-control/skills/grok-bot-control/tests
      - name: Type-check helpers
        run: mypy scripts plugins/grok-bot-control/skills/grok-bot-control/scripts

  required:
    name: Required checks
    if: always()
    needs: [offline-matrix, static-analysis]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          MATRIX_RESULT: ${{ needs.offline-matrix.result }}
          STATIC_RESULT: ${{ needs.static-analysis.result }}
        run: test "$MATRIX_RESULT" = success && test "$STATIC_RESULT" = success
