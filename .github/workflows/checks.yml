name: Offline checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
env:
  PYTHONDONTWRITEBYTECODE: 1
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s plugins/grok-bot-control/skills/grok-bot-control/tests -v
      - run: python3 scripts/run_review_cases.py
      - run: python3 scripts/validate_release.py
      - run: python3 scripts/build_release.py --output dist
